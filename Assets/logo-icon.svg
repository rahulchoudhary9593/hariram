<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Rounded Square Container -->
  <rect width="100" height="100" rx="28" fill="#111827"/>
  
  <!-- Subtle inner border with brand primary color -->
  <rect x="3" y="3" width="94" height="94" rx="25" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Road perspective base -->
  <path d="M50 15 L15 85 H85 L50 15 Z" fill="#1F2937"/>

  <!-- Road side borders (Yellow markings) -->
  <path d="M50 15 L15 85" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
  <path d="M50 15 L85 85" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>

  <!-- Center dashed line (White) -->
  <path d="M50 18 L50 82" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round"/>

  <!-- Reflection glow at the horizon -->
  <circle cx="50" cy="15" r="5" fill="#FBBF24" opacity="0.8"/>
</svg>
