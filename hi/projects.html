<!DOCTYPE html>
<html lang="hi" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Projects | DM Infra Solutions</title>
    <meta name="description"
        content="View our portfolio of completed infrastructure and road construction projects by DM Infra Solutions, a trusted PWD contractor.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@700;800&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FBBF24',
                        dark: '#111827',
                        secondary: '#374151',
                        bg: '#F8FAFC',
                        success: '#25D366'
                    },
                    fontFamily: {
                        heading: ['Manrope', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>

<body class="antialiased text-secondary relative pt-20">

    <div id="header-container"></div>

    <!-- Page Header -->
    <div class="bg-dark py-16 lg:py-24 relative overflow-hidden">
        <div class="absolute inset-0 bg-primary/10"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="text-center">
                <h1 class="text-3xl md:text-5xl lg:text-6xl font-bold font-heading text-white mb-4">Featured <span
                        class="text-primary">Projects</span></h1>
                <p class="text-lg text-gray-400 max-w-2xl mx-auto">Showcasing our excellence in executing critical
                    infrastructure projects across the region.</p>
            </div>
        </div>
    </div>

    <!-- Projects Portfolio -->
    <section class="py-20 lg:py-32">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Dynamic project cards will be loaded here -->
            </div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="../script.js"></script>
    <script src="../projects.js"></script>
</body>

</html>
